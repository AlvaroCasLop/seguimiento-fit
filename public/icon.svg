<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#131a2b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e040fb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="8" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#purpleGrad)" stroke-width="12" opacity="0.3" />

  <!-- Activity Pulse Heartbeat Line -->
  <path d="M 96 256 L 176 256 L 208 160 L 256 360 L 304 200 L 336 280 L 368 256 L 416 256" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Central Dumbbell / Lightning Accent Dot -->
  <circle cx="256" cy="360" r="14" fill="#00f2fe" />
  <circle cx="208" cy="160" r="14" fill="#7f00ff" />
</svg>
